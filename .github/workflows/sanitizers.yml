name: PHP Core Sanitizer Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sanitizers.yml'
      - 'configs/refs.lock.json'
      - 'tests/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: php-core-sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    name: PHP 8.5.12 / ASan+UBSan
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      USE_ZEND_ALLOC: '0'
      NO_INTERACTION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang autoconf automake bison re2c pkg-config make \
            libxml2-dev libsqlite3-dev libonig-dev libssl-dev
      - name: Verify pinned upstream source
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 - <<'PY' > evidence/source-sha.txt
          import json
          print(json.load(open("configs/refs.lock.json"))["entries"]["php-8.5.12"])
          PY
          SHA="$(cat evidence/source-sha.txt)"
          git init -q php-src
          git -C php-src remote add origin https://github.com/php/php-src.git
          git -C php-src fetch --depth=1 --no-tags origin "$SHA"
          git -C php-src checkout -q --detach FETCH_HEAD
          test "$(git -C php-src rev-parse HEAD)" = "$SHA"
          echo "Verified source $SHA"
      - name: Build upstream PHP under ASan and UBSan
        run: |
          set -Eeuo pipefail
          (
            cd php-src
            ./buildconf --force
            CC=clang CXX=clang++ CFLAGS="-O0 -g -fno-omit-frame-pointer" \
              ./configure --disable-all --enable-cli --enable-debug \
              --enable-address-sanitizer --enable-undefined-sanitizer \
              --enable-zend-test --enable-session --enable-xml \
              --with-libxml --enable-mbstring
            make -j2
          ) > evidence/build.log 2>&1 || {
            tail -n 100 evidence/build.log
            exit 1
          }
          ./php-src/sapi/cli/php -n -v | tee evidence/php-version.txt
          printf '%s\n' 'CC=clang CXX=clang++ CFLAGS=-O0 -g -fno-omit-frame-pointer' \
            'configure: --disable-all --enable-cli --enable-debug --enable-address-sanitizer --enable-undefined-sanitizer --enable-zend-test --enable-session --enable-xml --with-libxml --enable-mbstring' \
            'runtime: USE_ZEND_ALLOC=0 ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1' > evidence/sanitizer-config.txt
      - name: Targeted PHPT tests with sanitizer
        run: |
          set -Eeuo pipefail
          PHP_BINARY="$PWD/php-src/sapi/cli/php"
          (
            cd php-src
            "$PHP_BINARY" -n run-tests.php -q --asan -j1 -p "$PHP_BINARY" ../tests/*.phpt
          ) 2>&1 | tee evidence/asan-phpt.log
      - name: Store ASan baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-sanitizers-8.5.12-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
